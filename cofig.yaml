name: "Surf forecast addon"
slug: "surf_forecast_addon"
description: "Surf metrics."
version: "1.0.0"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
ports:
  8080/tcp: 8080
webui: "http://[HOST]:[PORT:8080]"
ingress: true
ingress_port: 8080
panel_icon: "mdi:wave"
panel_title: "Surf Forecast"
options:
  spots:
    - "Ribeira d'Ilhas"
    - "Supertubos"
    - "Guincho"
  notifications:
    enable: true
    min_wave_height: 1.5
    max_wind_kts: 15
    webhook_url: "http://supervisor/core/api/events/surf_alert"
schema:
  spots:
    - str
  notifications:
    enable: bool
    min_wave_height: float
    max_wind_kts: int
    webhook_url: str?
