<div class="forecast-card forecast-card--no-data">
	<div class="forecast-card__header">
		<span class="badge badge--no-data">NO DATA</span>
	</div>
	<div class="forecast-card__wave forecast-card__wave--empty">
		<svg
			class="forecast-card__wave-icon forecast-card__wave-icon--muted"
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="2"
			stroke-linecap="round"
			stroke-linejoin="round"
		>
			<path d="M2 12c1.5-3 3-5 5-5s3.5 2 5 5 3.5 5 5 5 3.5-2 5-5" />
			<line x1="2" y1="2" x2="22" y2="22" stroke-width="2.5"></line>
		</svg>
		<span class="forecast-card__wave-height forecast-card__wave-height--muted">--</span>
	</div>
	<div class="forecast-card__meta forecast-card__meta--muted">
		<div class="forecast-card__metric">
			<svg
				class="forecast-card__arrow-icon forecast-card__arrow-icon--muted"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
			>
				<circle cx="12" cy="12" r="9"></circle>
				<line x1="9" y1="12" x2="15" y2="12"></line>
			</svg>
			<span class="forecast-card__val">--</span>
		</div>
		<div class="forecast-card__temp">
			<span>--</span>
		</div>
	</div>
	<div class="forecast-card__meta forecast-card__meta--muted">
		<div class="forecast-card__metric">
			<svg
				class="forecast-card__wind-icon forecast-card__wind-icon--muted"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
			>
				<circle cx="12" cy="12" r="9"></circle>
				<line x1="9" y1="12" x2="15" y2="12"></line>
			</svg>
			<span class="forecast-card__val">--</span>
		</div>
		<div class="forecast-card__weather">
			<span class="forecast-card__placeholder-text">Offline</span>
		</div>
	</div>
</div>
