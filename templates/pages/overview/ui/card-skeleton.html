<div class="forecast-card forecast-card--skeleton" aria-hidden="true">
	<div class="forecast-card__header">
		<span class="skeleton skeleton--badge"></span>
	</div>
	<div class="forecast-card__wave">
		<span class="skeleton skeleton--wave-icon"></span>
		<span class="skeleton skeleton--wave-value"></span>
	</div>
	<div class="forecast-card__meta">
		<div class="forecast-card__metric">
			<span class="skeleton skeleton--arrow"></span>
			<span class="skeleton skeleton--value"></span>
		</div>
		<div class="forecast-card__temp">
			<span class="skeleton skeleton--temp"></span>
		</div>
	</div>
	<div class="forecast-card__meta">
		<div class="forecast-card__metric">
			<div class="forecast-card__val-box">
				<span class="skeleton skeleton--wind-value"></span>
			</div>
		</div>
		<div class="forecast-card__weather">
			<span class="skeleton skeleton--weather-icon"></span>
			<span class="skeleton skeleton--air-temp"></span>
		</div>
	</div>
</div>
