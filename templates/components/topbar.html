<header class="app-topbar">
    <div class="app-topbar__left">
        <div class="brand">
            <svg class="brand__icon"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2.2"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <path d="M2 12c1.5-3 3-5 5-5s3.5 2 5 5 3.5 5 5 5 3.5-2 5-5" />
                <path d="M2 17c1.5-2 3-3.5 5-3.5s3.5 1.5 5 3.5 3.5 3.5 5 3.5 3.5-1.5 5-3.5" />
            </svg>
            <span class="brand__title">SURF DASHBOARD</span>
        </div>
    </div>
    <div class="app-topbar__center"></div>
    <div class="app-topbar__right">
        <div class="date-navigator">
            <div class="date-navigator__label">
                <span>{{ date_range_label }}</span>
                <svg class="date-navigator__icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
            </div>
        </div>
    </div>
</header>
